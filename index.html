<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TB HSJR 页面</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
    <style>
        /* 极简重置与基础样式 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #eef7ff; color: #000000; padding: 10px; min-height: 100vh; transition: all 0.3s ease; }
        .container { max-width: 1200px; margin: 0 auto; }
        img { border-radius: 8px; max-width: 100%; height: auto; transition: all 0.3s ease; }

        /* 核心工具类 */
        .text-center { text-align: center; margin: 16px 0; }
        .card { background: rgba(255,255,255,0.85); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: all 0.3s ease; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); }

        /* 头部与切换按钮 */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .logo { font-size: 22px; font-weight: 700; }
        .theme-toggle { background: none; border: none; font-size: 20px; cursor: pointer; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; }

        /* 暗黑模式（极简版） */
        body.dark { background: #343434; color: #fff; }
        body.dark .card { background: rgba(40,40,56,0.85); }

        /* 响应式极简适配 */
        @media (max-width: 768px) {
            .header { flex-wrap: wrap; gap: 8px; }
            .text-center img { width: 60px; margin: 0 2px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <div class="logo">TB🌱HSJR</div>
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换主题">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>
        
        <!-- 核心内容卡片 -->
        <section class="card">
            <div class="text-center">
              ⏰<span id="ss"></span><br><br>
                <p>邮箱：hsjr@tb90.de5.net</p>
            </div>

            <!-- 主图 -->
          
            <center><img src="https://cdn.jsdelivr.net/gh/ttbb1978/ttbb1978.github.io@tb01/img/006.jpg" class="text-center" alt="展示图" ></center>

        <!-- 页脚 -->
        
            <div class="text-center">
            <p>四川省 德阳市 旌阳区（天元街道）</p><br>
            <p>&copy; 2026 TB🌱HSJR All Rights Reserved</p>
        </div>
    </div>

    <script>
    

        // 3. 运行时间统计
        function showRunTime() {
            const startTime = new Date("1997/01/01 00:00:00");
            setInterval(() => {
                const diff = new Date() - startTime;
                const d = Math.floor(diff / (24*60*60*1000));
                const h = Math.floor((diff % (24*60*60*1000)) / (60*60*1000));
                const m = Math.floor((diff % (60*60*1000)) / (60*1000));
                const s = Math.floor((diff % (60*1000)) / 1000);
                document.getElementById('ss').textContent = `${d}天 ${h}小时 ${m}分 ${s}秒`;
            }, 1000);
        }

        // 4. 主题切换
        function toggleTheme() {
            const body = document.body;
            const icon = document.querySelector('.theme-toggle i');
            body.classList.toggle('dark');
            icon.className = body.classList.contains('dark') ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            localStorage.setItem('theme', body.classList.contains('dark') ? 'dark' : 'light');
        }
     
        // 6. 页面初始化（极简）
        window.onload = () => {
            // 加载保存的主题
            if (localStorage.getItem('theme') === 'dark') {
                document.body.classList.add('dark');
                document.querySelector('.theme-toggle i').className = 'fa-solid fa-sun';
            }
            showRunTime();
            renderImgs();
        };
    </script>
</body>
</html>
